name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a PyInstaller binary inherits the build
          # machine's glibc floor, and 2.35 reaches far more distros than 2.39.
          - os: ubuntu-22.04
            artifact: cal2xl-linux
          - os: windows-latest
            artifact: cal2xl-windows
          - os: macos-latest
            artifact: cal2xl-mac-apple-silicon
          - os: macos-13
            artifact: cal2xl-mac-intel

    steps:
      - uses: actions/checkout@v4

      # Tk links against these at build time; PyInstaller can only bundle what it
      # can resolve. Present on the runner image already, pinned here so a future
      # image change cannot silently produce a Tk-less binary.
      - name: Install Tk runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxft2 libxrender1 libxext6 libfontconfig1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group build --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build executable
        run: uv run pyinstaller cal2xl.spec --noconfirm

      # Package so the executable bit (Linux) and the bundle structure (macOS)
      # survive; upload-artifact zips discard POSIX permissions.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.artifact }}.tar.gz cal2xl

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/cal2xl.app ${{ matrix.artifact }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/cal2xl.exe ${{ matrix.artifact }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
